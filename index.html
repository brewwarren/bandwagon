<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搬瓦工库存监控 - BandwagonHost Stock Monitor</title>
  <style>
    :root {
      --bg-body: #f7f9fa;
      --bg-card: #ffffff;
      --text-main: #2c3e50;
      --text-sub: #7f8c8d;
      --border: #eaeff2;
      --green: #27ae60;
      --red: #c0392b;
      --blue: #3498db;
      --table-header: #34495e;
      --table-hover: #fcfdfe;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      font-size: 14px;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      background: var(--bg-card);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
      border-radius: 8px;
      overflow: hidden;
    }

    header {
      padding: 20px 30px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0;
      color: #2c3e50;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      background: #2c3e50;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 14px;
    }

    .meta-info {
      font-size: 13px;
      color: var(--text-sub);
    }

    .time-badge {
      font-family: monospace;
      background: #edf2f7;
      padding: 4px 8px;
      border-radius: 4px;
      color: #4a5568;
      font-weight: 600;
    }

    /* Table Styles */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
    }

    thead {
      background-color: var(--table-header);
      color: #fff;
    }

    th {
      padding: 15px 12px;
      text-align: left;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    td {
      padding: 14px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tbody tr:hover {
      background-color: var(--table-hover);
    }

    /* Column Specifics */
    .col-plan {
      font-weight: 600;
      color: var(--blue);
      min-width: 180px;
    }

    .col-price {
      font-weight: 700;
      color: #e67e22;
    }

    .col-loc {
      max-width: 250px;
      white-space: normal;
      font-size: 13px;
      color: #555;
      line-height: 1.4;
    }

    /* Status Badges */
    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      min-width: 60px;
    }

    .badge-stock {
      background-color: rgba(39, 174, 96, 0.1);
      color: var(--green);
      border: 1px solid rgba(39, 174, 96, 0.2);
    }

    .badge-oos {
      background-color: rgba(192, 57, 43, 0.1);
      color: var(--red);
      border: 1px solid rgba(192, 57, 43, 0.2);
    }

    /* Action Buttons */
    .btn {
      display: inline-block;
      padding: 6px 15px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-buy {
      background-color: var(--red);
      color: white;
      border: 1px solid var(--red);
    }

    .btn-buy:hover {
      background-color: #b03025;
      box-shadow: 0 2px 5px rgba(192, 57, 43, 0.3);
    }

    .btn-disable {
      background-color: #95a5a6;
      color: white;
      cursor: not-allowed;
      opacity: 0.7;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: var(--text-sub);
      font-size: 12px;
      border-top: 1px solid var(--border);
      margin-top: 10px;
    }

    .aff-notice {
      background: #fff8e1;
      color: #d68f12;
      padding: 10px;
      text-align: center;
      font-size: 12px;
      border-bottom: 1px solid var(--border);
    }

    @media screen and (max-width: 768px) {

      .col-loc,
      .col-cpu,
      .col-bw {
        display: none;
      }

      /* Hide details on small screens */
      h1 {
        font-size: 18px;
      }

      th,
      td {
        padding: 10px 8px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="aff-notice">
      🔥 实时监控搬瓦工所有稀缺传家宝方案库存状态 · <span style="font-weight:bold">自动同步官网数据</span>
    </div>

    <header>
      <h1><span class="logo-icon">BWG</span> 搬瓦工库存监控</h1>
      <div class="meta-info">
        更新时间：<span id="last-updated" class="time-badge">加载中...</span>
      </div>
    </header>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>方案名称</th>
            <th class="col-cpu">CPU</th>
            <th>内存</th>
            <th>硬盘</th>
            <th class="col-bw">流量/月</th>
            <th>带宽</th>
            <th class="col-loc">可选机房</th>
            <th>价格</th>
            <th style="text-align:center">库存</th>
            <th style="text-align:center">购买</th>
          </tr>
        </thead>
        <tbody id="plan-list">
          <tr>
            <td colspan="10" style="text-align:center; padding: 50px; color:#7f8c8d;">
              正在同步数据...
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <footer>
      <p>数据源自搬瓦工官方接口 • 每 30 分钟自动更新 • 本站仅做库存展示</p>
    </footer>
  </div>

  <script>
    async function init() {
      const tbody = document.getElementById('plan-list');
      const timeEl = document.getElementById('last-updated');

      try {
        // Fetch data
        const res = await fetch('data/vps_data.json?t=' + Date.now());
        if (!res.ok) throw new Error("Load failed");
        const data = await res.json();

        // Update Time
        timeEl.textContent = data.last_updated;

        // Render Table
        tbody.innerHTML = '';

        const plans = data.plans || [];

        if (plans.length === 0) {
          tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding:30px;">暂无数据</td></tr>';
          return;
        }

        plans.forEach(p => {
          const tr = document.createElement('tr');

          const stockHtml = p.stock
            ? `<span class="badge badge-stock">有货</span>`
            : `<span class="badge badge-oos">缺货</span>`;

          const btnHtml = p.stock
            ? `<a href="${p.link}" target="_blank" class="btn btn-buy">立即购买</a>`
            : `<span class="btn btn-disable">缺货中</span>`;

          tr.innerHTML = `
                    <td class="col-plan">${p.name}</td>
                    <td class="col-cpu">${p.cpu}</td>
                    <td>${p.ram}</td>
                    <td>${p.disk}</td>
                    <td class="col-bw">${p.bandwidth}</td>
                    <td>${p.speed}</td>
                    <td class="col-loc">${p.location}</td>
                    <td class="col-price">${p.price}</td>
                    <td style="text-align:center">${stockHtml}</td>
                    <td style="text-align:center">${btnHtml}</td>
                `;
          tbody.appendChild(tr);
        });

      } catch (e) {
        console.error(e);
        tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; color:red; padding:30px;">数据加载失败，请刷新重试</td></tr>';
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>

</body>

</html>
