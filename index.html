<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bandwagon Inventory - Status Monitor</title>
  <style>
    /* Bibliotik/Gazelle inspired minimalist aesthetic */
    body {
      background-color: #f2f2f2;
      color: #333;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      margin: 0;
      padding: 20px;
    }

    .wrapper {
      max-width: 1000px;
      margin: 0 auto;
      background-color: #fff;
      padding: 10px;
      border: 1px solid #ccc;
    }

    header {
      text-align: center;
      border-bottom: 2px solid #555;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 20px;
      margin: 0;
      color: #111;
      font-weight: normal;
      letter-spacing: 1px;
    }

    .meta-nav {
      margin-top: 10px;
      font-size: 11px;
      color: #666;
    }

    .meta-nav span {
      margin: 0 10px;
    }

    /* Table Style - Clean, tight, data-focused */
    .table-container {
      margin-top: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid #ccc;
    }

    th {
      background-color: #eee;
      padding: 8px;
      border: 1px solid #ccc;
      text-align: left;
      font-weight: bold;
      color: #444;
    }

    td {
      padding: 8px;
      border: 1px solid #eee;
      vertical-align: middle;
    }

    tr:nth-child(even) {
      background-color: #fafafa;
    }

    tr:hover {
      background-color: #f0f0f0;
    }

    /* Typography & Colors */
    a {
      color: #3e5f8e;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .plan-title {
      font-weight: bold;
      color: #111;
    }

    .spec-item {
      color: #555;
    }

    .price-bold {
      font-weight: bold;
      color: #d00;
      /* Subtle red for price */
    }

    .status-badge {
      font-weight: bold;
      padding: 2px 4px;
      text-transform: uppercase;
      font-size: 10px;
    }

    .stock-yes {
      color: #2a7d2e;
    }

    .stock-no {
      color: #b33d3d;
    }

    .promo-box {
      background-color: #fff8e1;
      border: 1px solid #ffd54f;
      padding: 10px;
      margin-bottom: 20px;
      font-size: 11px;
      text-align: center;
    }

    #last-updated-tag {
      font-family: monospace;
      color: #222;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      font-size: 11px;
      color: #888;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }

    /* Mobile adjustments */
    @media (max-width: 600px) {
      .wrapper {
        padding: 5px;
      }

      th,
      td {
        padding: 5px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <div class="wrapper">
    <header>
      <h1>Inventory Overview</h1>
      <div class="meta-nav">
        <span>Server Status Monitor</span> |
        <span>Last Updated: <strong id="last-updated-tag">Fetching...</strong></span>
      </div>
    </header>

    <div class="promo-box">
      Global Promo Code: <strong style="cursor:pointer; color:#3e5f8e;" onclick="copyPromo()"
        title="Click to copy">BWHCGLUKKB</strong>
      <span id="copy-notif" style="display:none; color:green; margin-left:10px;">[Copied]</span>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th width="25%">Plan Name</th>
            <th width="30%">Specifications</th>
            <th width="15%">Region</th>
            <th width="10%">Price/yr</th>
            <th width="10%">Stock</th>
            <th width="10%">Link</th>
          </tr>
        </thead>
        <tbody id="inventory-data">
          <tr>
            <td colspan="6" style="text-align:center; padding: 40px;">Synchronizing with remote source...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <footer>
      [ Automated system active ] - This data is refreshed every 5 minutes from bandwagonhost.com
    </footer>
  </div>

  <script>
    async function loadData() {
      const tableBody = document.getElementById('inventory-data');
      const timeTag = document.getElementById('last-updated-tag');

      try {
        // Fetch with cache bust
        const response = await fetch('data/vps_data.json?nocache=' + Date.now());
        const json = await response.json();

        // Update UI
        timeTag.innerText = json.last_updated || 'N/A';

        const plans = json.plans || json;
        tableBody.innerHTML = '';

        if (plans.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No data available.</td></tr>';
          return;
        }

        plans.forEach(plan => {
          const tr = document.createElement('tr');
          const isOutOfStock = !plan.stock;

          tr.innerHTML = `
                    <td><span class="plan-title">${plan.name}</span></td>
                    <td class="spec-item">
                        ${plan.cpu} / ${plan.ram} / ${plan.disk}<br>
                        <small style="color:#888;">${plan.bandwidth} @ ${plan.speed}</small>
                    </td>
                    <td><span style="font-size:11px;">${plan.location}</span></td>
                    <td><span class="price-bold">${plan.price}</span></td>
                    <td>
                        <span class="status-badge ${plan.stock ? 'stock-yes' : 'stock-no'}">
                            ${plan.stock ? 'In Stock' : 'Out of Stock'}
                        </span>
                    </td>
                    <td>
                        ${plan.stock
              ? `<a href="${plan.link}" target="_blank">Order</a>`
              : `<span style="color:#ccc;">N/A</span>`}
                    </td>
                `;
          tableBody.appendChild(tr);
        });

      } catch (err) {
        console.error(err);
        tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">Connection error. Please try again.</td></tr>';
      }
    }

    function copyPromo() {
      navigator.clipboard.writeText('BWHCGLUKKB');
      const span = document.getElementById('copy-notif');
      span.style.display = 'inline';
      setTimeout(() => span.style.display = 'none', 1500);
    }

    document.addEventListener('DOMContentLoaded', loadData);
  </script>

</body>

</html>
