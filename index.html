<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bandwagon Inventory :: Stock Monitor</title>
  <style>
    /* Bibliotik / Gazelle Style Reset */
    body {
      background-color: #f6f6f6;
      color: #444;
      font-family: Verdana, Arial, Helvetica, sans-serif;
      font-size: 11px;
      margin: 0;
      padding: 20px;
    }

    a {
      text-decoration: none;
      color: #356be5;
    }

    a:hover {
      text-decoration: underline;
    }

    .container {
      width: 95%;
      max-width: 1400px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #ccc;
      padding: 15px;
    }

    /* Header Area */
    header {
      border-bottom: 2px solid #555;
      padding-bottom: 10px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    h1 {
      font-size: 16px;
      font-weight: bold;
      margin: 0;
      color: #333;
    }

    .update-time {
      font-size: 10px;
      color: #888;
    }

    /* Filter Bar (Like a torrent category filter) */
    .filter-bar {
      background: #eee;
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
      margin-bottom: 15px;
    }

    .filter-btn {
      display: inline-block;
      margin: 0 5px;
      padding: 3px 6px;
      cursor: pointer;
      color: #333;
      border: 1px solid transparent;
    }

    .filter-btn:hover {
      text-decoration: underline;
    }

    .filter-btn.active {
      font-weight: bold;
      background: #fff;
      border: 1px solid #aaa;
    }

    /* Info Box */
    .infobox {
      border: 1px solid #e6db55;
      background: #ffffe0;
      padding: 10px;
      margin-bottom: 15px;
      text-align: center;
      color: #555;
    }

    /* The Data Table */
    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid #ccc;
    }

    th {
      background-color: #e5e5e5;
      border: 1px solid #ccc;
      color: #333;
      padding: 6px;
      font-weight: bold;
      text-align: left;
    }

    td {
      border: 1px solid #ddd;
      padding: 6px;
      vertical-align: middle;
    }

    tr.row-a {
      background-color: #f9f9f9;
    }

    tr.row-b {
      background-color: #fff;
    }

    tr:hover {
      background-color: #f0f0f0;
    }

    /* Columns */
    .col-plan {
      font-weight: bold;
      color: #222;
      width: 20%;
    }

    .col-spec {
      text-align: center;
      width: 6%;
    }

    .col-loc {
      width: 25%;
      font-size: 10px;
      color: #666;
    }

    .col-price {
      font-weight: bold;
      color: #b00;
      text-align: right;
      width: 8%;
    }

    .col-score {
      font-weight: bold;
      color: #e67e22;
      width: 6%;
      text-align: center;
      cursor: help;
    }

    /* Orange for score */
    .col-stock {
      text-align: center;
      font-weight: bold;
      width: 8%;
    }

    .col-buy {
      text-align: center;
      width: 8%;
    }

    /* Score Badges based on value */
    .score-high {
      color: #27ae60;
    }

    .score-med {
      color: #f39c12;
    }

    .score-low {
      color: #7f8c8d;
    }

    /* ... skipped ... */

    <div class="filter-bar" id="filters"><span class="filter-btn active" onclick="filterData('all', this)">[ 全部方案]</span><span class="filter-btn" onclick="filterData('GIA', this)">[ CN2 GIA]</span><span class="filter-btn" onclick="filterData('Limited', this)">[ 限量版]</span><span class="filter-btn" onclick="filterData('HK', this)">[ 香港]</span><span class="filter-btn" onclick="filterData('JP', this)">[ 日本]</span><span class="filter-btn" onclick="filterData('Stock', this)">[ 仅看有货]</span><span class="filter-btn" onclick="sortData('score', this)" style="color:#e67e22">[ 🔥按性价比排序]</span></div><table><thead><tr><th>方案名称 (Plans)</th><th class="col-spec">CPU</th><th class="col-spec">内存</th><th class="col-spec">硬盘</th><th class="col-spec">流量</th><th class="col-spec">带宽</th><th class="col-loc">可选机房 (Location)</th><th class="col-score" title="越高越好：基于配置和线路价格比计算">评分</th><th class="col-price">价格/年</th><th class="col-stock">状态</th><th class="col-buy">购买</th></tr></thead><tbody id="plan-list"><tr><td colspan="11" style="text-align:center; padding:20px;">Fetching inventory...</td></tr></tbody></table>< !-- ... footer ... --></div><script>let allPlans=[];
    let currentFilter='all'; // Track current filter for sorting

    async function load() {
      try {
        const res=await fetch('data/vps_data.json?t=' + Date.now());
        const data=await res.json();

        document.getElementById('last-updated').innerText=data.last_updated;
        allPlans=data.plans || [];

        // Initial render
        render(allPlans);

      }

      catch (e) {
        console.error(e);
      }
    }

    function render(list) {
      const tbody=document.getElementById('plan-list');
      tbody.innerHTML='';

      if (list.length===0) {
        tbody.innerHTML='<tr><td colspan="11" style="text-align:center; padding:20px;">无匹配数据</td></tr>';
        return;
      }

      list.forEach((p, idx)=> {
          const rowClass=idx % 2===0 ? 'row-a' : 'row-b';
          const tr=document.createElement('tr');
          tr.className=rowClass;

          const stockText=p.stock ? `<span class="status-in" >有货 ✔</span>` : `<span class="status-out" >缺货 ✖</span>`;

          const buyBtn=p.stock ? `<a href="${p.link}" class="btn-link" target="_blank" >Order</a>` : `<span class="oos-text" >---</span>`;

          // Score styling
          let scoreVal=p.score || 0;
          let scoreClass='score-low';
          if (scoreVal >=8.0) scoreClass='score-high';
          else if (scoreVal >=5.0) scoreClass='score-med';

          tr.innerHTML=` <td class="col-plan" >$ {
            p.name
          }

          </td> <td class="col-spec" >$ {
            p.cpu
          }

          </td> <td class="col-spec" >$ {
            p.ram
          }

          </td> <td class="col-spec" >$ {
            p.disk
          }

          </td> <td class="col-spec" >$ {
            p.bandwidth
          }

          </td> <td class="col-spec" >$ {
            p.speed
          }

          </td> <td class="col-loc" >$ {
            p.location
          }

          </td> <td class="col-score ${scoreClass}" >$ {
            scoreVal
          }

          </td> <td class="col-price" >$ {
            p.price
          }

          </td> <td class="col-stock" >$ {
            stockText
          }

          </td> <td class="col-buy" >$ {
            buyBtn
          }

          </td> `;
          tbody.appendChild(tr);
        });
    }

    function filterData(type, btn) {
      document.querySelectorAll('.filter-btn').forEach(b=> b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter=type; // Save state

      if (type==='all') {
        render(allPlans);
        return;
      }

      if (type==='Stock') {
        render(allPlans.filter(p=> p.stock===true));
        return;
      }

      const keyword=type==='GIA' ? 'GIA'
      : type==='Limited' ? '限量'
      : type==='HK' ? '香港'
      : type==='JP' ? '日本'
      : '';

      const filtered=allPlans.filter(p=> p.name.includes(keyword) || p.location.includes(keyword));
      render(filtered);
    }

    function sortData(key, btn) {
      document.querySelectorAll('.filter-btn').forEach(b=> b.classList.remove('active'));
      btn.classList.add('active');

      // Sort allPlans descending by score
      const sorted=[...allPlans].sort((a, b)=> (b.score || 0) - (a.score || 0));
      render(sorted);
    }

    document.addEventListener('DOMContentLoaded', load);
    </script></body></html>
